<title>Roland's Home OT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a phone-first therapy binder. Each goal is a coloured divider tab
   (the clinic's foam-block colours), content is one column of cards, and the
   tab bar sits under the thumb. */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --surface-2: #e7ecf4;
  --ink: #16203a;
  --ink-2: #44506b;
  --ink-3: #66718a;
  --line: #d6dde9;
  --accent: #2346a6;
  --accent-ink: #ffffff;
  --accent-soft: #e2e9f9;
  --good: #23824a;
  --warn: #a86d00;
  --bad: #b8392f;
  --g-body: #c43c35;
  --g-balance: #187f86;
  --g-twohands: #5d7c1c;
  --g-hands: #b55e08;
  --g-scissors: #e0ab10;
  --g-pencil: #5e4bc0;
  --s1: #2a78d6;
  --s2: #eb6834;
  --ot-1: #c8423b;
  --ot-3: #e8c21c;
  --ot-4: #6cae3e;
  --shadow: 0 1px 2px rgba(22, 32, 58, .06), 0 4px 14px rgba(22, 32, 58, .06);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10151f; --surface: #182030; --surface-2: #222c3f; --ink: #e9eef7; --ink-2: #b9c2d4;
    --ink-3: #8f9ab0; --line: #2d3850; --accent: #8fb0ff; --accent-ink: #0d1424; --accent-soft: #1f2c4a;
    --good: #5cc787; --warn: #e3ac3c; --bad: #ef7d73; --s1: #3987e5; --s2: #d95926;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10151f; --surface: #182030; --surface-2: #222c3f; --ink: #e9eef7; --ink-2: #b9c2d4;
  --ink-3: #8f9ab0; --line: #2d3850; --accent: #8fb0ff; --accent-ink: #0d1424; --accent-soft: #1f2c4a;
  --good: #5cc787; --warn: #e3ac3c; --bad: #ef7d73; --s1: #3987e5; --s2: #d95926;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; font-weight: 800; line-height: 1.15; }
h3 { font-size: 1.1rem; font-weight: 600; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: .88rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* App frame */
.topbar { padding: 14px 16px 10px; max-width: 820px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-size: 1.55rem; font-weight: 800; line-height: 1.05; }
.brand p { color: var(--ink-3); font-size: .9rem; margin-top: 3px; }
.iconbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .9rem; color: var(--ink); }
.iconbtn svg { width: 18px; height: 18px; }
main { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 4px 120px; }
.view { display: grid; gap: 16px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabs ul { list-style: none; margin: 0 auto; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); max-width: 820px; }
.tabs button { width: 100%; background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 2px;
  font-size: .72rem; font-weight: 700; color: var(--ink-3); border-radius: 10px; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (min-width: 860px) {
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding: 6px 16px; }
  .tabs button { grid-auto-flow: column; gap: 8px; font-size: .9rem; padding: 9px 6px; }
  .tabs button svg { width: 18px; height: 18px; }
  main { padding-block: 20px 60px; }
}

/* Cards & bits */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card > * + * { margin-top: 10px; }
.stack > * + * { margin-top: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 18px;
  font-weight: 700; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.small { padding: 8px 12px; font-size: .9rem; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 6px 12px; font-size: .9rem; font-weight: 700; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--g, var(--ink-3)); }
.banner { border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); color: var(--ink); font-size: .95rem; }
.banner.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.banner b { font-weight: 700; }
ul.clean { margin: 0; padding-left: 1.15em; }
ul.clean li + li { margin-top: 4px; }
ol.steps { margin: 0; padding-left: 1.3em; }
ol.steps li + li { margin-top: 4px; }

/* Goal colours (binder dividers) */
[data-g="body"] { --g: var(--g-body); --g-on: #fff; }
[data-g="balance"] { --g: var(--g-balance); --g-on: #fff; }
[data-g="twohands"] { --g: var(--g-twohands); --g-on: #fff; }
[data-g="hands"] { --g: var(--g-hands); --g-on: #fff; }
[data-g="scissors"] { --g: var(--g-scissors); --g-on: #231a00; }
[data-g="pencil"] { --g: var(--g-pencil); --g-on: #fff; }
.idx { display: inline-block; background: var(--g); color: var(--g-on); font-size: .7rem; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; padding: 5px 10px 4px; border-radius: 8px 8px 0 0; margin-left: 14px; position: relative; top: 1px; }
.tabbed { display: block; }
.tabbed > .card { border-top-left-radius: 6px; }

/* Today */
.daypick { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.daypick .chip { flex: 0 0 auto; }
.plan { display: grid; gap: 12px; }
.block { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: start; }
.block .when { text-align: center; padding-top: 22px; }
.block .when b { display: block; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; font-weight: 800; }
.block .when span { font-size: .72rem; color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
.block .card { padding: 14px; }
.actbtn { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; }
.actbtn.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); text-align: left; }
.acard > * + * { margin-top: 0; }
.actbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.actbtn h3 { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--g) 60%, transparent); text-underline-offset: 4px; text-decoration-thickness: 2px; }
.swap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.swap .chip { font-size: .8rem; padding: 4px 10px; }
.say { border-radius: 10px; background: var(--surface-2); padding: 8px 12px; font-weight: 700; }
.say::before { content: "Say: "; color: var(--ink-3); font-weight: 400; }
.hero { display: grid; gap: 6px; }
.hero h2 { font-size: 1.8rem; }

/* Activities */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.acard { padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%; }
.acard .ph { aspect-ratio: 4 / 3; background: var(--surface-2); max-width: 100%; }
.acard .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.acard .ph.none { aspect-ratio: auto; height: 64px; display: grid; place-items: center; color: var(--g); background: color-mix(in srgb, var(--g) 10%, var(--surface)); }
.acard .ph.none svg { width: 34px; height: 34px; opacity: .85; }
.acard .txt { padding: 12px 14px 14px; display: grid; gap: 4px; }
.acard .txt p { color: var(--ink-2); font-size: .92rem; }

/* Sheet (activity detail / timer) */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 24, .5); z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--bg); width: min(720px, 100%); max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0;
  padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 760px) { .scrim { align-items: center; } .sheet { border-radius: 20px; max-height: 88vh; } }
.sheet-head { position: sticky; top: 0; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; z-index: 2; }
.sheet-head h2 { flex: 1; min-width: 0; font-size: 1.35rem; }
.closebtn { border: 1px solid var(--line); background: var(--surface); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; flex: 0 0 auto; }
.closebtn svg { width: 18px; height: 18px; }
.detail { display: grid; gap: 12px; }
.detail figure { margin: 0; }
.detail figure img { border-radius: 12px; display: block; width: 100%; max-height: 360px; object-fit: cover; }
.detail figcaption { font-size: .85rem; color: var(--ink-3); margin-top: 6px; }
.ladder { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.ladder > div { border-radius: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); }
.ladder b { display: block; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* Timer */
.timer { display: grid; justify-items: center; gap: 14px; padding-block: 8px 4px; }
.dial { width: min(260px, 70vw); aspect-ratio: 1; position: relative; max-width: 100%; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .read { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 8px 14px; border-radius: 9px; font-weight: 700; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.bigsecs { font-family: var(--font-display); font-weight: 800; font-size: 5rem; line-height: 1; font-variant-numeric: tabular-nums; }

/* Forms */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .field > .lbl { font-weight: 700; font-size: .95rem; }
.field .hint { font-size: .84rem; color: var(--ink-3); }
.field input[type="date"], .field input[type="number"], .field input[type="text"], .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.field textarea { min-height: 72px; resize: vertical; }
.inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.pairs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale label { position: relative; }
.scale input { position: absolute; opacity: 0; inset: 0; }
.scale span { display: inline-block; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: .9rem; color: var(--ink-2); }
.scale input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.scale input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.pick { display: grid; gap: 10px; }
.pick .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pick .grp .idx { margin: 0 6px 0 0; border-radius: 6px; top: 0; }
.pick .chip { font-size: .82rem; padding: 5px 10px; }
.entry { display: grid; gap: 4px; padding: 12px 0; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: .86rem; color: var(--ink-3); }
.copybox { width: 100%; min-height: 180px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--surface); font: .9rem/1.45 var(--font-body); }

/* Progress */
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.tile .lbl { font-size: .85rem; color: var(--ink-3); }
.tile .val { font-size: 1.9rem; font-weight: 700; line-height: 1.15; margin-top: 4px; }
.tile .sub { font-size: .84rem; color: var(--ink-2); margin-top: 2px; }
.chart { position: relative; margin: 0; }
.chart svg { width: 100%; max-width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--ink-3); font-size: 11px; font-family: var(--font-body); }
.chart .goal line { stroke: var(--ink-3); stroke-width: 1; }
.chart .goal text { fill: var(--ink-2); font-size: 11px; font-weight: 700; font-family: var(--font-body); }
.chart .cross { stroke: var(--ink-3); stroke-width: 1; }
.chart .series path { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .86rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 16px; height: 2px; border-radius: 2px; background: var(--c); }
.legend i.ring { width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink-3); }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: .84rem; box-shadow: var(--shadow); min-width: 130px; z-index: 3; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r i { width: 12px; height: 2px; background: var(--c); display: inline-block; }
.tip .r b { font-variant-numeric: tabular-nums; }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 18px; text-align: center; color: var(--ink-3); font-size: .92rem; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .8rem; font-weight: 700; background: var(--surface-2); color: var(--ink-2); }
.pill.up { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--good); }
.pill.down { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); }
.skills { display: grid; }
.skill { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.skill:first-child { border-top: 0; }
@media (max-width: 560px) { .skill { grid-template-columns: 1fr; } }
.meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; width: 92px; }
.meter i { height: 8px; border-radius: 2px; background: var(--surface-2); }
.meter i.on { background: var(--accent); }

/* OT scale tiles (from the OT report) */
.otscale { display: grid; gap: 8px; }
.otrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.otrow .tiles5 { display: flex; gap: 4px; }
.otrow .tiles5 i { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center;
  font-style: normal; font-weight: 700; font-size: .85rem; color: var(--ink-3); background: var(--surface); }
.otrow .tiles5 i.may { box-shadow: inset 0 0 0 2px var(--ink-3); }
.otrow .tiles5 i.sep { color: #1b1b1b; }
.otrow .tiles5 i.sep.v1, .otrow .tiles5 i.sep.v2 { background: var(--ot-1); color: #fff; }
.otrow .tiles5 i.sep.v3 { background: var(--ot-3); }
.otrow .tiles5 i.sep.v4, .otrow .tiles5 i.sep.v5 { background: var(--ot-4); }

/* Guide */
.toc { display: flex; gap: 6px; flex-wrap: wrap; }
.toc a { text-decoration: none; }
.guide section { scroll-margin-top: 70px; }
.cues { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.cue { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; }
.cue b { display: block; font-size: 1.05rem; }
.cue span { color: var(--ink-3); font-size: .86rem; }
.diagram { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.diagram svg { width: 100%; height: auto; display: block; }
.diagram text { font-family: var(--font-body); }

/* Kit */
.kitgrp { display: grid; gap: 0; }
.kititem { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.kititem:first-child { border-top: 0; }
.kititem input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--accent); }
.kititem .nm { font-weight: 700; }
.kititem .why { font-size: .9rem; color: var(--ink-2); }
.kititem .where { font-size: .84rem; color: var(--ink-3); margin-top: 2px; }
.kititem .price { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kititem.done .nm { text-decoration: line-through; color: var(--ink-3); }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--warn); margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<header class="topbar">
  <div class="brand">
    <h1>Roland's Home OT</h1>
    <p id="weekline">Term 4 home programme</p>
  </div>
  <button class="iconbtn" id="timerBtn" type="button" aria-label="Open timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/></svg>
    Timer
  </button>
</header>

<nav class="tabs" aria-label="Sections">
  <ul>

  rules: [
    { t: "Little and often", d: "About 20 minutes, 5 days a week. In a trial of parent-run OT home programmes, about 17 sessions a month of about 16 minutes worked." },
    { t: "Body before hands", d: "Always start with movement. Heavy work wakes up the core and shoulders so sitting and pencil work are easier." },
    { t: "Make it play", d: "Hide the exercise inside a game, story or job. Offer him a choice of 2 or 3 activities, colours or the order." },
    { t: "Aim for 4 out of 5", d: "He should succeed most of the time. Missing 3 or more out of 10: make it easier. Spot-on 2 sessions in a row: try the harder version." },
    { t: "One cue, same words", d: "Use the short cue words in this guide, one at a time. Talk about the result ('make the scissors walk on the road'), not his body parts. Get him to say the cue too." },
    { t: "Feedback: lots, then less", d: "With a new skill, tell him how he did on most tries. Once he has it, every second or third try, then a summary at the end." },
    { t: "Praise the effort", d: "'You turned the paper with your helper hand!' works better than 'you're so clever'. Specific praise keeps him trying after mistakes." },
    { t: "Same skill, new look", d: "Once a skill is coming, vary it: different paper, crayons, chalk, a wall, the floor, the garden." },
    { t: "Stop before he's done", d: "Watch for the tired signs below and switch to a movement break. Always end on a success." },
    { t: "Set up for a lefty", d: "Left-handed scissors, paper to his left and tilted, light from his right, you on his right." },
    { t: "Log it", d: "Two minutes after each session. The log is how his parents and the OT see progress." }
  ],
  tiredSigns: [
    "Propping his head on his hand or lying on the table",

    "Rushing, scribbling, silliness or tears"

    { t: "Physiopedia: assessment and exercise in early childhood (egg and superman hold norms).", u: "https://www.physio-pedia.com/Assessment_and_Exercise_Interventions_in_Early_and_Middle_Childhood_Development" },
    { t: "Single-leg stance in 5-year-olds (2024 study).", u: "https://pmc.ncbi.nlm.nih.gov/articles/PMC11764375/" },
    { t: "NHS Somerset: pre-writing shapes and ages.", u: "https://www.somersetft.nhs.uk/children-and-young-peoples-therapy-service/pre-writing-activities/" },
    { t: "Teach Handwriting: paper position for left- and right-handers.", u: "https://www.teachhandwriting.co.uk/paper-position-for-comfortable-handwriting.html" },
    { t: "West Suffolk NHS: handwriting (left-handers) and sitting posture.", u: "https://www.wsh.nhs.uk/CMS-Documents/Services/Integrated-Community-Paediatric-Services-OT/g.-Handwriting.pdf" },
    { t: "ABUHB NHS: developing a tripod grasp; left-handed scissors.", u: "https://abuhb.nhs.wales/files/childrens-ot/school-based-occupation/developing-a-tripod-grasp-advice-pdf/" },
    { t: "Growing Hands-On Kids: scissor skill checklist, ages 2–6.", u: "https://www.growinghandsonkids.com/scissor-skill-development-checklist-for-ages-2-6.html" },
    { t: "Kid Sense: balance, coordination and pre-writing skills.", u: "https://childdevelopment.com.au/areas-of-concern/writing/writing-readiness-pre-writing-skills/" },
    { t: "The OT Toolbox: in-hand manipulation.", u: "https://www.theottoolbox.com/in-hand-manipulation-for-functional/" },
    { t: "Primitive reflex programmes: a review of the evidence.", u: "https://pmc.ncbi.nlm.nih.gov/articles/PMC9301367/" }
  ]
};
/*DATA-END*/
</script>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ACT = Object.fromEntries(DATA.activities.map((a) => [a.id, a]));
  const LS_KEY = "roland-ot-v1";
  const DAY_NAMES = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  // ---------- dates ----------
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };
  const dayNum = (s) => Math.round(parse(s).getTime() / 864e5);
  const fmtDate = (s, opts = { weekday: "short", day: "numeric", month: "short" }) => parse(s).toLocaleDateString("en-ZA", opts);
  const today = () => iso(new Date());
  const START = DATA.programme.start;
  function weekOf(s) { return Math.floor((dayNum(s) - dayNum(START)) / 7) + 1; }
  function weekdayIdx(s) { return (parse(s).getDay() + 6) % 7; } // Mon=0
  function phaseOf(w) { return DATA.phases.find((p) => w >= p.from && w <= p.to) || null; }

  // ---------- state ----------
  const S = {
    tab: "today", day: null, swaps: {}, filter: "all", logMode: "session",
    sessions: [], checkins: [], kit: {}, mode: "loading", readOnly: false, db: null, pendingDelete: null
  };
  const local = {
    load() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; } },
    save(obj) { try { localStorage.setItem(LS_KEY, JSON.stringify(obj)); } catch { /* storage blocked */ } },
    get(key, dflt) { const o = local.load(); return o[key] ?? dflt; },
    set(key, val) { const o = local.load(); o[key] = val; local.save(o); }
  };

  // ---------- storage adapter ----------
  async function initStore() {
    let db = null;
    try { db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null; } catch { db = null; }
    if (!db) { useLocal(); return; }
    S.db = db; S.mode = "db";
    try {
      const user = await window.claude.use("user");
      const can = user ? await user.can("data.write") : null;
      if (can === false) S.readOnly = true;
    } catch { /* keep inputs; a refused write decides */ }
    const onErr = (e) => { if (e && (e.code === "revoked" || e.code === "not_granted")) { S.readOnly = true; renderBanner(); } };
    db.collection("sessions").orderBy("date", "desc").limit(500).onSnapshot((snap) => {
      S.sessions = snap.docs.map((d) => ({ id: d.id, ...d.data() })); refresh();
    }, onErr);
    db.collection("checkins").orderBy("date", "desc").limit(200).onSnapshot((snap) => {
      S.checkins = snap.docs.map((d) => ({ id: d.id, ...d.data() })); refresh();
    }, onErr);
    db.collection("kit").onSnapshot((snap) => {
      const k = {}; snap.docs.forEach((d) => { k[d.id] = !!(d.data() || {}).bought; }); S.kit = k; refresh(["kit"]);
    }, onErr);
    renderBanner(); refresh();
  }
  function useLocal() {
    S.mode = "local";
    S.sessions = local.get("sessions", []); S.checkins = local.get("checkins", []); S.kit = local.get("kit", {});
    sortAll(); renderBanner(); refresh();
  }
  function sortAll() {
    S.sessions.sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")));
    S.checkins.sort((a, b) => (b.date + (b.createdAt || "")).localeCompare(a.date + (a.createdAt || "")));
  }
  async function addEntry(coll, obj) {
    if (S.mode === "db") {
      try { await S.db.collection(coll).add(obj); return true; }
      catch (e) {
        if (e && e.code === "invalid_argument") { S.readOnly = true; renderBanner(); }
        toast(e && e.code === "quota_exceeded" ? "The log is full. Delete some old entries and try again." : "Couldn't save. Check your connection and try again.");
        return false;
      }
    }
    obj.id = "l" + Date.now().toString(36);
    S[coll].push(obj); sortAll(); local.set(coll, S[coll]); refresh(); return true;
  }
  async function deleteEntry(coll, id) {
    if (S.mode === "db") { try { await S.db.doc(`${coll}/${id}`).delete(); } catch { toast("Couldn't delete that entry."); } return; }
    S[coll] = S[coll].filter((x) => x.id !== id); local.set(coll, S[coll]); refresh();
  }
  async function setKit(id, bought) {
    S.kit[id] = bought;
    if (S.mode === "db") { try { await S.db.doc(`kit/${id}`).set({ bought, at: new Date().toISOString() }); } catch { toast("Couldn't save the tick."); } }
    else local.set("kit", S.kit);
    render("kit");
  }

  function renderBanner() {
    const b = $("#statusBanner");
    let html = "";
    if (S.mode === "local") html = `<div class="banner warn"><b>Saved on this device only.</b> Open this page from the link Roland's parents shared (signed in) so the log reaches them. Until then, use "Send on WhatsApp" after each entry.</div>`;
    else if (S.readOnly) html = `<div class="banner warn"><b>View only.</b> You can read everything but can't save logs. Ask Roland's parents to share this page with you as an <b>Editor</b>. You can still copy each entry to WhatsApp.</div>`;
    b.innerHTML = html; b.hidden = !html;
    if (html) b.style.marginBottom = "16px";
  }
  let toastTimer;
  function toast(msg) {
    let t = $("#toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status");
      t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;box-shadow:var(--shadow)";
      document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
  }

  // ---------- helpers ----------
  const goalIdx = (g) => `<span class="idx" data-g="${g}">${esc(DATA.goals[g].name)}</span>`;
  const photoOr = (a) => a.img ? `<div class="ph"><img src="${a.img}" alt="${esc(a.cap || a.name)}" loading="lazy"></div>` :
    `<div class="ph none" data-g="${a.g}">${goalIcon(a.g)}</div>`;
  function goalIcon(g) {
    const p = {
      body: '<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M8 22l4-7 4 7M6 11h12"/>',
      balance: '<circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v8l-4 6M12 15h-0M5 10h14M12 15l3 2"/>',
      twohands: '<path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10M10 9.5V4a1.5 1.5 0 0 1 3 0v6M17 11V6.5a1.5 1.5 0 0 0-3 0V10M7 11c-1.5-1-3 0-2 2l3 5c1 2 3 3 5 3h1c3 0 5-2 5-5v-5"/>',
      hands: '<path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V13M17 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-3l-3-5a1.6 1.6 0 0 1 2.6-1.8L8 13"/>',
      scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',
      pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/>'
    }[g];
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  }
  function planFor(dayIdx) { return dayIdx >= 0 && dayIdx < 5 ? DATA.plan[dayIdx] : null; }
  function chosen(dayIdx, key) {
    const p = planFor(dayIdx); if (!p) return null;
    const list = p.blocks[key]; const pick = (S.swaps[dayIdx] || {})[key];
    return pick && list.includes(pick) ? pick : list[0];
  }
  function isCheckinDay(dateStr) { return weekdayIdx(dateStr) === 4 && DATA.programme.checkinWeeks.includes(weekOf(dateStr)); }
  function nextCheckin(fromStr) {
    for (const w of DATA.programme.checkinWeeks) {
      const fri = new Date(parse(START)); fri.setDate(fri.getDate() + (w - 1) * 7 + 4);
      if (iso(fri) >= fromStr) return { w, date: iso(fri) };
    }
    return null;
  }

  // ---------- header ----------
  function renderHeader() {
    const t = today(); const w = weekOf(t); const W = DATA.programme.weeks;
    let line;
    if (w < 1) line = `Starts ${fmtDate(START, { weekday: "long", day: "numeric", month: "long" })}`;
    else if (w > W) line = `Programme done · holiday maintenance`;
    else { const ph = phaseOf(w); line = `Week ${w} of ${W} · ${ph ? ph.name : ""} · ${fmtDate(t, { weekday: "long", day: "numeric", month: "long" })}`; }
    $("#weekline").textContent = line;
  }

  // ---------- TODAY ----------
  function renderToday() {
    const t = today(); const w = Math.max(1, Math.min(weekOf(t), DATA.programme.weeks));
    const todayIdx = weekdayIdx(t);
    const di = S.day ?? todayIdx;
    const plan = planFor(di);
    const ph = phaseOf(w);
    const seenGuide = local.get("seenGuide", false);
    const dateForDi = (() => { const d = parse(t); d.setDate(d.getDate() + (di - todayIdx)); return iso(d); })();
    let h = "";
    if (!seenGuide) h += `<div class="banner"><b>New here?</b> Read the Guide first (10 minutes): Roland's goals, the left-handed set-up and the cue words. <button class="btn small ghost" type="button" data-go="guide" style="margin-left:6px">Open the Guide</button></div>`;
    h += `<div class="daypick" role="group" aria-label="Choose a day">${DAY_NAMES.slice(0, 5).map((d, i) =>
      `<button class="chip" type="button" data-day="${i}" aria-pressed="${i === di}">${d.slice(0, 3)}${i === todayIdx ? " · today" : ""}</button>`).join("")}
      <button class="chip" type="button" data-day="5" aria-pressed="${di >= 5}">Weekend</button></div>`;
    if (!plan) {
      h += `<div class="hero"><p class="eyebrow">Weekend</p><h2>Family play, no formal session</h2><p class="muted">Movement-rich play still counts. A few ideas:</p></div>
        <div class="card"><ul class="clean">${DATA.weekend.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
        <div class="card"><h3>Everyday sneak-ins</h3><ul class="clean">${DATA.sneakIns.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
      $("#view-today").innerHTML = h; return;
    }
    const check = isCheckinDay(dateForDi);
    h += `<div class="hero"><p class="eyebrow">${esc(plan.day)} · about ${DATA.programme.minutes} minutes</p><h2>${esc(plan.theme)}</h2>
      ${ph ? `<p class="muted"><b>${esc(ph.name)} phase.</b> ${esc(ph.tip)}</p>` : ""}</div>`;
    if (check) h += `<div class="banner"><b>Check-in day (week ${weekOf(dateForDi)}).</b> Swap the Body block for the 10-minute check-in, then do the rest as normal. <button class="btn small" type="button" data-go="log" data-logmode="checkin" style="margin-left:6px">Open check-in</button></div>`;
    h += `<div class="plan">`;
    for (const blk of DATA.session) {
      if (blk.key === "finish") {
        h += `<div class="block"><div class="when"><b>${blk.min}</b><span>min</span></div><div class="card"><p class="eyebrow">${esc(blk.label)}</p><p>${esc(blk.note)}</p>
          <div class="row"><button class="btn" type="button" data-go="log" data-logmode="session">Log this session</button></div></div></div>`;
        continue;
      }
      const id = chosen(di, blk.key); const a = ACT[id]; const list = plan.blocks[blk.key];
      h += `<div class="block"><div class="when"><b>${blk.min}</b><span>min</span></div><div class="tabbed" data-g="${a.g}">${goalIdx(a.g)}<div class="card">
        <p class="eyebrow">${esc(blk.label)}</p>
        <button class="actbtn" type="button" data-act="${a.id}"><h3>${esc(a.name)}</h3></button>
        <p class="muted small">${esc(a.why)}</p>
        <p class="say">${esc(a.say)}</p>
        ${list.length > 1 ? `<div class="swap"><span class="small muted">Or:</span>${list.filter((x) => x !== id).map((x) =>
          `<button class="chip" type="button" data-swap="${x}" data-blk="${blk.key}" data-di="${di}">${esc(ACT[x].name)}</button>`).join("")}</div>` : ""}
      </div></div></div>`;
    }
    h += `</div><div class="row"><button class="btn ghost" type="button" data-timer="${DATA.programme.minutes * 60}">Start a ${DATA.programme.minutes}-minute timer</button></div>`;
    $("#view-today").innerHTML = h;
  }

  // ---------- ACTIVITIES ----------
  function renderActivities() {
    const f = S.filter;
    let h = `<div class="hero"><p class="eyebrow">Activity library</p><h2>${DATA.activities.length} activities, grouped by goal</h2>
      <p class="muted">Tap a card for steps, cue words and how to make it easier or harder.</p></div>`;
    h += `<div class="filters" role="group" aria-label="Filter by goal"><button class="chip" type="button" data-filter="all" aria-pressed="${f === "all"}">All</button>${Object.entries(DATA.goals).map(([k, g]) =>
      `<button class="chip" type="button" data-filter="${k}" data-g="${k}" aria-pressed="${f === k}"><span class="dot"></span>${esc(g.name)}</button>`).join("")}</div>`;
    const groups = f === "all" ? Object.keys(DATA.goals) : [f];
    for (const g of groups) {
      const list = DATA.activities.filter((a) => a.g === g);
      h += `<div class="stack"><div><h3>${esc(DATA.goals[g].name)}</h3><p class="muted small">${esc(DATA.goals[g].sub)}</p></div><div class="cards">${list.map((a) =>
        `<div class="tabbed" data-g="${a.g}">${goalIdx(a.g)}<button class="actbtn card acard" type="button" data-act="${a.id}">${photoOr(a)}<div class="txt"><h3>${esc(a.name)}</h3><p>${esc(a.why)}</p></div></button></div>`).join("")}</div></div>`;
    }
    $("#view-activities").innerHTML = h;
  }
  function openActivity(id) {
    const a = ACT[id]; if (!a) return;
    $("#sheetTitle").textContent = a.name;
    $("#sheetBody").innerHTML = `<div class="detail" data-g="${a.g}">
      <div>${goalIdx(a.g)}</div>
      ${a.img ? `<figure><img src="${a.img}" alt="${esc(a.cap || a.name)}"><figcaption>${esc(a.cap || "")}</figcaption></figure>` : ""}
      <p><b>Why:</b> ${esc(a.why)}</p>
      <div class="card"><p class="eyebrow">How</p><ol class="steps">${a.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></div>
      <p class="say">${esc(a.say)}</p>
      <div class="ladder"><div><b>Easier</b>${esc(a.easier)}</div><div><b>Harder</b>${esc(a.harder)}</div></div>
      <div class="ladder"><div><b>How much</b>${esc(a.dose)}</div><div><b>You need</b>${esc(a.kit)}</div></div>
      ${a.time ? `<div class="row"><button class="btn ghost" type="button" data-stopwatch="1">Time a hold</button></div>` : ""}
    </div>`;
    openSheet();
  }

  // ---------- LOG ----------
  function renderLog() {
    const m = S.logMode;
    let h = `<div class="hero"><p class="eyebrow">Log</p><h2>${m === "session" ? "How did today go?" : "Fortnightly check-in"}</h2>
      <p class="muted">${m === "session" ? "Two minutes after each session. Roland's parents see this on the Progress tab." : "Every second Friday (weeks 1, 3, 5, 7, 9). Takes about 10 minutes. Best of 3 tries for timed items."}</p></div>
      <div class="seg" role="group" aria-label="Log type"><button type="button" data-logmode="session" aria-pressed="${m === "session"}">Session</button><button type="button" data-logmode="checkin" aria-pressed="${m === "checkin"}">Check-in</button></div>`;
    h += m === "session" ? sessionForm() : checkinForm();
    h += `<div id="recentWrap">${recentList(m)}</div>`;
    $("#view-log").innerHTML = h;
  }
  function scaleRadios(name, labels, checked, start = 0) {
    return `<div class="scale">${labels.map((l, i) => `<label><input type="radio" name="${name}" value="${i + start}" ${checked === i + start ? "checked" : ""}><span>${esc(l)}</span></label>`).join("")}</div>`;
  }
  function sessionForm() {
    const t = today(); const di = weekdayIdx(t); const p = planFor(di);
    const pre = new Set(p ? DATA.session.filter((b) => b.key !== "finish").map((b) => chosen(di, b.key)) : []);
    const who = local.get("who", "Chrystal");
    return `<form class="card form" id="sessionForm" novalidate>
      <div class="pairs"><div class="field"><label for="s-date">Date</label><input type="date" id="s-date" name="date" value="${t}" required></div>
      <div class="field"><label for="s-min">Minutes</label><input type="number" id="s-min" name="minutes" min="0" max="120" inputmode="numeric" value="${DATA.programme.minutes}"></div>
      <div class="field"><label for="s-who">Logged by</label><input type="text" id="s-who" name="who" value="${esc(who)}" maxlength="40"></div></div>
      <div class="field"><span class="lbl">What did you do?</span><span class="hint">Today's plan is ticked. Tap to change.</span>
        <div class="pick">${Object.keys(DATA.goals).map((g) => `<div class="grp" data-g="${g}">${goalIdx(g)}${DATA.activities.filter((a) => a.g === g).map((a) =>
          `<button type="button" class="chip" data-pick="${a.id}" aria-pressed="${pre.has(a.id)}">${esc(a.name)}</button>`).join("")}</div>`).join("")}</div></div>
      <div class="field"><span class="lbl">His mood</span>${scaleRadios("mood", ["Not today", "Grumpy", "OK", "Happy", "Loved it"], 4, 1)}</div>
      <div class="field"><span class="lbl">Focus and effort</span>${scaleRadios("focus", ["Very low", "Low", "OK", "Good", "Great"], 3, 1)}</div>
      <div class="field"><span class="lbl">Grip reminders needed</span>${scaleRadios("gripPrompts", ["None", "A few", "Lots"], 1)}</div>
      <div class="field"><span class="lbl">Did he swap hands while colouring?</span>${scaleRadios("swapped", ["No", "Once or twice", "Often", "No colouring today"], 3)}</div>
      <div class="field"><label for="s-wins">What went well</label><textarea id="s-wins" name="wins" maxlength="600" placeholder="e.g. Held the egg for 12 s; cut the whole circle with his helper hand turning the paper."></textarea></div>
      <div class="field"><label for="s-hard">What was hard</label><textarea id="s-hard" name="hard" maxlength="600" placeholder="e.g. Tired after 5 minutes of colouring; didn't want to close his eyes."></textarea></div>
      <div class="row"><button class="btn" type="submit" ${S.readOnly ? "disabled" : ""}>Save session</button><button class="btn ghost" type="button" data-wa="session">Send on WhatsApp</button></div>
    </form>`;
  }
  function numField(key, label, hint, timer) {
    const m = DATA.measures[key];
    return `<div class="field"><label for="c-${key}">${esc(label || m.label)} <span class="muted">(${m.unit === "s" ? "seconds" : m.unit === "min" ? "minutes" : "times"})</span></label>
      ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}
      <div class="inline"><input type="number" id="c-${key}" name="${key}" min="0" max="${m.unit === "s" ? 120 : 60}" step="${m.unit === "s" ? 0.5 : 1}" inputmode="decimal">
      ${timer ? `<button class="btn small ghost" type="button" data-stopwatch="1" data-fill="c-${key}" aria-label="Time ${esc(m.label)}">Time it</button>` : ""}</div></div>`;
  }
  function checkinForm() {
    const t = today();
    return `<form class="card form" id="checkinForm" novalidate>
      <div class="pairs"><div class="field"><label for="c-date">Date</label><input type="date" id="c-date" name="date" value="${t}"></div>
      <div class="field"><label for="c-who">Logged by</label><input type="text" id="c-who" name="who" value="${esc(local.get("who", "Chrystal"))}" maxlength="40"></div></div>
      <p class="eyebrow">Balance · barefoot, hands on hips, best of 3</p>
      <div class="pairs">${numField("balOpenR", "", "", true)}${numField("balOpenL", "", "", true)}${numField("balClosedR", "", "Hands hovering at his hips. Leave blank if he won't try.", true)}${numField("balClosedL", "", "", true)}</div>
      <p class="eyebrow">Core · stop the clock when his shape breaks</p>
      <div class="pairs">${numField("egg", "", "OT goal 15 s", true)}${numField("superman", "", "", true)}</div>
      <p class="eyebrow">At the table · watch during a normal table task</p>
      <div class="pairs">${numField("sitMin", "", "Until he props his head, slumps or kneels on the chair. OT goal 15–20 min.")}${numField("colourMin", "", "Small picture, until he asks to stop.")}${numField("switches", "", "Count swaps to his right hand.")}</div>

  // charts: one scale per chart, hairline grid, 2px lines, 8px markers with a surface ring
  const chartMeta = new Map();
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  // Charts are sized to their container so 11px text stays 11px on a phone.

  function drawCharts() {
    $$(".chartslot").forEach((slot) => {
      const spec = chartSpecs.get(slot.dataset.slot); if (!spec) return;
      const W = Math.max(280, Math.round(slot.clientWidth || 320));

  function lineSvg(id, { ser, goal, unit }, W) {
    const all = ser.flatMap((s) => s.pts);
    const H = 200, ml = 30, mr = goal ? 74 : 14, mt = 12, mb = 28;
    let x0 = Math.min(...all.map((p) => dayNum(p.d))), x1 = Math.max(...all.map((p) => dayNum(p.d)));
    if (x1 - x0 < 21) { x0 -= 10; x1 += 10; }
    const vmax = Math.max(goal || 0, ...all.map((p) => p.v), 1);
    const step = niceStep((vmax * 1.15) / 4); const y1 = Math.ceil((vmax * 1.15) / step) * step;
    const X = (d) => ml + ((dayNum(d) - x0) / (x1 - x0)) * (W - ml - mr);

    let ax = `<g class="axis">`; for (let v = 0; v <= y1 + 1e-9; v += step) ax += `<text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
    // x ticks: month starts for long ranges, otherwise weekly; never closer than ~56px

    if (span > 70) { const m = new Date(d0.getFullYear(), d0.getMonth() + 1, 1); while (Math.round(m.getTime() / 864e5) <= x1) { ticks.push({ n: Math.round(m.getTime() / 864e5), l: m.toLocaleDateString("en-ZA", { month: "short" }) }); m.setMonth(m.getMonth() + 1); } }
    else { const st = Math.max(7, Math.ceil(span / Math.max(2, Math.floor(plotW / 64)) / 7) * 7); for (let n = x0 + 3; n <= x1; n += st) { const dd = new Date(n * 864e5); ticks.push({ n, l: dd.toLocaleDateString("en-ZA", { day: "numeric", month: "short" }) }); } }
    const every = Math.max(1, Math.ceil(ticks.length / Math.max(1, Math.floor(plotW / 44))));
    ticks.forEach((tk, i) => { if (i % every === 0) ax += `<text x="${Xn(tk.n)}" y="${H - 8}" text-anchor="middle">${esc(tk.l)}</text>`; });
    ax += `</g>`;
    const goalG = goal ? `<g class="goal"><line x1="${ml}" x2="${W - mr}" y1="${Y(goal)}" y2="${Y(goal)}"/><text x="${W - mr + 6}" y="${Y(goal) + 4}">Goal ${goal} ${unit}</text></g>` : "";
    let sg = ""; const byX = new Map();
    for (const s of ser) {
      const pts = s.pts.slice().sort((a, b) => a.d.localeCompare(b.d));
      if (pts.length > 1) sg += `<g class="series"><path d="${pts.map((p, i) => `${i ? "L" : "M"}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}" style="stroke:${s.c}"/></g>`;
      for (const p of pts) {
        sg += p.ot ? `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4.5" style="fill:var(--surface);stroke:${s.c};stroke-width:2"/>`
          : `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="4" style="fill:${s.c};stroke:var(--surface);stroke-width:2"/>`;
        if (!byX.has(p.d)) byX.set(p.d, { x: X(p.d), d: p.d, rows: [] });
        byX.get(p.d).rows.push({ name: s.name, c: s.c, v: p.v, ot: !!p.ot });

    return `<figure class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" tabindex="0" aria-label="Line chart; use arrow keys to read values">${g}${goalG}${ax}${sg}
      <line class="cross" x1="0" x2="0" y1="${mt}" y2="${H - mb}" visibility="hidden"/><rect x="${ml}" y="${mt}" width="${W - ml - mr}" height="${H - mt - mb}" fill="transparent"/></svg>
      <div class="tip" hidden></div></figure>`;
  }
  function barSvg(b, W) {
    const H = 160, ml = 8, mr = 74, mt = 14, mb = 26; const target = DATA.programme.sessionsPerWeek;
    const ymax = Math.max(target + 1, ...b.map((x) => x.n)); const Y = (v) => mt + (1 - v / ymax) * (H - mt - mb);
    const slot = (W - ml - mr) / b.length; const bw = Math.min(24, slot * 0.55); const cw = weekOf(today());
    let s = `<g class="grid"><line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}"/></g>`;

  function bindCharts() {
    $$("figure.chart[data-chart]").forEach((fig) => {
      const meta = chartMeta.get(fig.dataset.chart); if (!meta || !meta.xs.length) return;
      const svg = $("svg", fig), cross = $(".cross", fig), tip = $(".tip", fig); let idx = meta.xs.length - 1;
      const show = (i) => {
        idx = Math.max(0, Math.min(meta.xs.length - 1, i)); const pt = meta.xs[idx];
        cross.setAttribute("x1", pt.x); cross.setAttribute("x2", pt.x); cross.setAttribute("visibility", "visible");
        tip.innerHTML = `<div class="small muted">${esc(fmtDate(pt.d, { day: "numeric", month: "short", year: "numeric" }))}</div>` + pt.rows.map((r) =>
          `<div class="r"><i style="--c:${r.c}"></i><b>${fmtN(r.v)} ${meta.unit}</b><span class="muted">${esc(r.name)}${r.ot ? " · OT" : ""}</span></div>`).join("");
        tip.hidden = false;
        const px = (pt.x / meta.W) * fig.clientWidth; const tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(fig.clientWidth - tw, px + 12 > fig.clientWidth - tw ? px - tw - 12 : px + 12)) + "px";
      };
      const hide = () => { cross.setAttribute("visibility", "hidden"); tip.hidden = true; };
      svg.addEventListener("pointermove", (e) => {
        const r = svg.getBoundingClientRect(); const vx = ((e.clientX - r.left) / r.width) * meta.W;
        let best = 0, bd = Infinity; meta.xs.forEach((p, i) => { const d = Math.abs(p.x - vx); if (d < bd) { bd = d; best = i; } }); show(best);
      });
      svg.addEventListener("pointerleave", hide);
      svg.addEventListener("focus", () => show(idx)); svg.addEventListener("blur", hide);
      svg.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") { show(idx - 1); e.preventDefault(); } if (e.key === "ArrowRight") { show(idx + 1); e.preventDefault(); } });
    });
  }

          <circle id="arc" cx="50" cy="50" r="45" style="fill:none;stroke:var(--g-body);stroke-width:10;stroke-linecap:round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - s.left / s.total)}"/></svg>

        <div class="row" role="group" aria-label="Minutes">${[1, 2, 3, 5, 8, 10, 25].map((m) => `<button class="chip" type="button" data-preset="${m * 60}" aria-pressed="${s.total === m * 60}">${m} min</button>`).join("")}</div>`
      : `<div class="bigsecs" id="tRead" aria-live="off">${(s.elapsed / 1000).toFixed(1)}</div><p class="muted">seconds. Count out loud with him. Stop when his position breaks.</p>`;
    $("#sheetBody").innerHTML = `<div class="timer">
      <div class="seg" role="group" aria-label="Timer type"><button type="button" data-tmode="count" aria-pressed="${s.mode === "count"}">Countdown</button><button type="button" data-tmode="watch" aria-pressed="${s.mode === "watch"}">Hold timer</button></div>

      ${s.mode === "watch" && s.fill && !s.running && s.elapsed > 0 ? `<button class="btn" type="button" id="tUse">Use ${fmtN(Math.round(s.elapsed / 500) / 2)} s</button>` : ""}</div></div>`;

      s.left = Math.max(0, s.leftAtStart - (now - s.t0) / 1000);
      const C = 2 * Math.PI * 45; const arc = $("#arc"); if (arc) arc.setAttribute("stroke-dashoffset", String(C * (1 - s.left / s.total)));
      const r = $("#tRead"); if (r) r.textContent = mmss(Math.ceil(s.left));
      if (s.left <= 0) { s.running = false; beep(); lockScreen(false); renderTimer(); toast("Time's up!"); return; }
    } else {
      s.elapsed = s.base + (now - s.t0); const r = $("#tRead"); if (r) r.textContent = (s.elapsed / 1000).toFixed(1);
    }
    s.raf = requestAnimationFrame(tick);
  }
  function stopTick() { if (tState) { cancelAnimationFrame(tState.raf); tState.running = false; } lockScreen(false); }

  // ---------- sheet ----------
  let lastFocus = null;
  function openSheet() { lastFocus = document.activeElement; $("#scrim").hidden = false; document.body.style.overflow = "hidden"; $("#sheetClose").focus(); }
  function closeSheet() { stopTick(); $("#scrim").hidden = true; document.body.style.overflow = ""; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

  // ---------- render dispatch ----------
  const renderers = { today: renderToday, activities: renderActivities, log: renderLog, progress: renderProgress, kit: renderKit, guide: renderGuide };
  const dirty = new Set();
  function render(tab) { renderers[tab](); dirty.delete(tab); }
  function refresh(tabs) {
    (tabs || ["log", "progress", "kit"]).forEach((t) => dirty.add(t));
    if (dirty.has(S.tab)) {
      // keep an in-progress form untouched
      if (S.tab === "log" && document.activeElement && $("#view-log").contains(document.activeElement) && document.activeElement.matches("input,textarea")) {
        const rw = $("#recentWrap"); if (rw) rw.innerHTML = recentList(S.logMode); // update the list only
        dirty.delete("log"); return;
      }
      render(S.tab);
    }
  }
  function go(tab, opts = {}) {
    if (!renderers[tab]) return;
    S.tab = tab; if (opts.logmode) S.logMode = opts.logmode;
    if (tab === "guide") local.set("seenGuide", true);
    $$(".tabs button").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    $$("main > .view").forEach((v) => { v.hidden = v.id !== "view-" + tab; });
    render(tab); window.scrollTo(0, 0);
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, a, label, input"); if (!t) { if (e.target === $("#scrim")) closeSheet(); return; }
    if (t.dataset.tab) return go(t.dataset.tab);
    if (t.dataset.go) return go(t.dataset.go, { logmode: t.dataset.logmode });
    if (t.dataset.anchor) { e.preventDefault(); const el = document.getElementById(t.dataset.anchor); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    if (t.dataset.day != null) { S.day = Number(t.dataset.day); return renderToday(); }
    if (t.dataset.swap) { const di = Number(t.dataset.di); S.swaps[di] = S.swaps[di] || {}; S.swaps[di][t.dataset.blk] = t.dataset.swap; return renderToday(); }
    if (t.dataset.act) return openActivity(t.dataset.act);
    if (t.dataset.filter) { S.filter = t.dataset.filter; return renderActivities(); }
    if (t.dataset.logmode && t.closest("#view-log")) { S.logMode = t.dataset.logmode; return renderLog(); }
    if (t.dataset.pick || t.dataset.shape) { t.setAttribute("aria-pressed", t.getAttribute("aria-pressed") === "true" ? "false" : "true"); return; }
    if (t.dataset.del) { S.pendingDelete = t.dataset.del; return renderLog(); }
    if (t.dataset.delNo) { S.pendingDelete = null; return renderLog(); }
    if (t.dataset.delYes) { const id = t.dataset.delYes; S.pendingDelete = null; deleteEntry(t.dataset.coll, id); return renderLog(); }
    if (t.dataset.wa) {
      if (t.dataset.wa === "session") return showShare(sessionText(readSession($("#sessionForm"))), "Send to Roland's parents");
      if (t.dataset.wa === "checkin") return showShare(checkinText(readCheckin($("#checkinForm"))), "Send to Roland's parents");
      return showShare(reportText(), "2-week summary");
    }
    if (t.dataset.timer) return openTimer({ mode: "count", seconds: Number(t.dataset.timer) });
    if (t.dataset.stopwatch) return openTimer({ mode: "watch", fill: t.dataset.fill || null });
    if (t.id === "timerBtn" || t.closest("#timerBtn")) return openTimer({ mode: "count", seconds: 300 });
    if (t.id === "sheetClose" || t.closest("#sheetClose")) return closeSheet();
    if (t.dataset.tmode) { const fill = tState && tState.fill; stopTick(); tState = { ...tState, mode: t.dataset.tmode, fill, running: false, elapsed: 0, left: tState.total }; return renderTimer(); }
    if (t.dataset.preset) { stopTick(); tState.total = tState.left = Number(t.dataset.preset); return renderTimer(); }
    if (t.id === "tGo") {
      const s = tState;
      if (s.running) { s.running = false; cancelAnimationFrame(s.raf); lockScreen(false); }
      else { if (s.mode === "count" && s.left <= 0) s.left = s.total; s.running = true; s.t0 = performance.now(); s.leftAtStart = s.left; s.base = s.elapsed; lockScreen(true); s.raf = requestAnimationFrame(tick); }
      return renderTimer();
    }
    if (t.id === "tReset") { stopTick(); tState.left = tState.total; tState.elapsed = 0; return renderTimer(); }
    if (t.id === "tUse") { const v = Math.round(tState.elapsed / 500) / 2; const f = document.getElementById(tState.fill); closeSheet(); if (f) { f.value = v; f.focus(); } return; }
  });
  document.addEventListener("change", (e) => { const k = e.target.dataset && e.target.dataset.kit; if (k) setKit(k, e.target.checked); });
  document.addEventListener("submit", async (e) => {
    e.preventDefault(); const f = e.target;
    if (f.id === "sessionForm") {
      const obj = readSession(f); if (obj.who) local.set("who", obj.who);
      const btn = $("button[type=submit]", f); btn.disabled = true;
      const ok = await addEntry("sessions", obj); btn.disabled = S.readOnly;
      if (ok) { toast("Session saved."); renderLog(); showShare(sessionText(obj), "Saved. Send to WhatsApp too?"); }
    }
    if (f.id === "checkinForm") {
      const obj = readCheckin(f); if (obj.who) local.set("who", obj.who);
      const btn = $("button[type=submit]", f); btn.disabled = true;
      const ok = await addEntry("checkins", obj); btn.disabled = S.readOnly;
      if (ok) { toast("Check-in saved."); renderLog(); showShare(checkinText(obj), "Saved. Send to WhatsApp too?"); }
    }
  });
  let rsz; window.addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { if (S.tab === "progress") drawCharts(); }, 150); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#scrim").hidden) closeSheet(); });

  // ---------- boot ----------
  renderHeader();
  const start = (location.hash || "").replace("#", "");
  go(renderers[start] ? start : "today");
  renderBanner();
  initStore();
})();
</script>
